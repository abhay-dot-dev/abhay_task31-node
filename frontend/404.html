<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">
  <main class="text-center p-8">
    <h1 class="text-5xl font-bold text-red-600">404</h1>
    <p class="mt-3 text-xl font-semibold text-slate-800">Page Not Found</p>
    <p class="mt-2 text-slate-600">Sorry, the requested page does not exist.</p>
    <a class="inline-block mt-6 text-blue-600 underline" href="/">Back to Home</a>
  </main>
</body>
</html>
